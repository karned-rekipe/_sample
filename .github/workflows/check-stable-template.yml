name: Template Stability Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  check-stable-deps:
    name: Verify stable PyPI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate generated dependency contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          import tomllib

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          generated_text = re.sub(
              r"\[tool\.uv\.sources\]\n(?:[^\[]*)",
              "",
              text,
              flags=re.DOTALL,
          )

          if "[tool.uv.sources]" in generated_text:
              print("❌ Generated pyproject would still contain [tool.uv.sources]")
              sys.exit(1)

          project = tomllib.loads(generated_text)["project"]
          arclith_deps = [
              dependency
              for dependency in project["dependencies"]
              if dependency.startswith("arclith[")
          ]
          if not arclith_deps:
              print("❌ Missing arclith dependency in generated pyproject")
              sys.exit(1)

          requirement = arclith_deps[0]
          if ">=0.12.0" not in requirement:
              print(f"❌ Generated project must require arclith>=0.12.0, got: {requirement}")
              sys.exit(1)

          print("✅ Generated project uses stable PyPI arclith>=0.12.0")
          print(requirement)
          PY
